name: Release APK

# A tag like v1.1.0 → a signed APK attached to the GitHub release of that tag,
# ready to download and install on the phone. "Run workflow" rebuilds an
# existing tag (e.g. if the first run failed).
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   OMNIVPN_KEYSTORE_BASE64   - the release .jks, base64-encoded
#   OMNIVPN_KEYSTORE_PASSWORD - its password
#   OMNIVPN_KEY_ALIAS         - key alias inside it
#   OMNIVPN_KEY_PASSWORD      - key password
# Every release must be signed with this same key: Android installs an update
# only over an app signed with the key it was first installed with.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      OMNIVPN_KEYSTORE_PASSWORD: ${{ secrets.OMNIVPN_KEYSTORE_PASSWORD }}
      OMNIVPN_KEY_ALIAS: ${{ secrets.OMNIVPN_KEY_ALIAS }}
      OMNIVPN_KEY_PASSWORD: ${{ secrets.OMNIVPN_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # versionCode = number of commits (app/build.gradle.kts) - needs full history.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Fetch libbox
        run: ./scripts/fetch-libbox.sh

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OMNIVPN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$OMNIVPN_KEYSTORE_PASSWORD" ] || [ -z "$OMNIVPN_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are not set - see the comment at the top of release.yml"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omnivpn-release.jks"
          echo "OMNIVPN_KEYSTORE_FILE=$RUNNER_TEMP/omnivpn-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed APKs
        run: |
          set -euo pipefail
          export OMNIVPN_VERSION_NAME="${TAG#v}"
          ./gradlew assembleRelease --no-daemon --stacktrace
          # One APK per architecture (splits in app/build.gradle.kts).
          out=app/build/outputs/apk/release
          cp "$out/app-arm64-v8a-release.apk" "OmniVPN-${OMNIVPN_VERSION_NAME}-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "OmniVPN-${OMNIVPN_VERSION_NAME}-armv7.apk"
          ls -lh OmniVPN-*.apk

      - name: Verify signatures
        run: |
          set -euo pipefail
          for apk in OmniVPN-*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Какой файл скачать: OmniVPN-${TAG#v}-arm64.apk — для почти всех телефонов; OmniVPN-${TAG#v}-armv7.apk — только для старых 32-битных."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" OmniVPN-*.apk --clobber
          else
            gh release create "$TAG" OmniVPN-*.apk --title "OmniVPN ${TAG#v}" --notes "$notes" --generate-notes
          fi
